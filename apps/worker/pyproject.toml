[project]
name = "worker"
version = "0.1.0"
description = "Worker Mistral Workflows : import de factures fournisseurs PDF dans Dolibarr"
requires-python = ">=3.12"
dependencies = [
    "mistralai-workflows[mistralai]>=3.19",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/worker"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
