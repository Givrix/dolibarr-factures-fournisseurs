[project]
name = "app-workspace"
version = "0.0.1"
requires-python = ">=3.12,<3.15"
dependencies = [
    "mistralai-capabilities-backend-workflows==0.1.71",
    "mistralai-capabilities-deployment-apps==0.1.71",
]

[tool.uv]
package = false
index-strategy = "first-index"
override-dependencies = ["griffe>=2"]
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
]

[[tool.uv.index]]
name = "pypi"
url = "https://pypi.org/simple"
default = true

[tool.uv.sources]

mistralai-capabilities-deployment-apps = { index = "pypi" }
mistralai-capabilities-backend-workflows = { index = "pypi" }

[tool.uv.workspace]
members = [
    "apps/*",
    "packages/py/*",
]

[tool.uv.exclude-newer-package]
"mistralai-capabilities-deployment-apps" = false
"mistralai-capabilities-backend-workflows" = false
